name: CI

on:
  push:
    branches: [__DEFAULT_BRANCH__]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://root:pass@127.0.0.1:5432/app_test
  REDIS_URL: redis://127.0.0.1:6379

jobs:
  lint-test-build:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # TODO(git-setup-repo): match the application's PostgreSQL major or remove this service.
      postgres:
        image: postgres:__POSTGRES_MAJOR__
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: app_test
        options: >-
          --health-cmd "pg_isready -U root -d app_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # TODO(git-setup-repo): pin the tested Redis major or remove this service.
      redis:
        image: redis:__REDIS_MAJOR__-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      # TODO(git-setup-repo): verify current action majors or pin immutable SHAs.
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # TODO(git-setup-repo): remove this step when the pinned Node release's bundled npm is the chosen baseline.
      - name: Set up npm
        run: |
          npm install --global npm@__NPM_VERSION__
          test "$(npm --version)" = "__NPM_VERSION__"

      - name: Install dependencies
        run: npm ci --prefer-offline --include=optional

      # TODO(git-setup-repo): adapt this to the real idempotent CI migration/bootstrap command.
      - name: Provision CI data
        run: npm run db:migrate

      - name: Check formatting
        run: npm run format:check

      - name: Lint and type-check
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
