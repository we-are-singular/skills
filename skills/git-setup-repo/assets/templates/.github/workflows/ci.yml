name: CI

on:
  push:
    branches: [__DEFAULT_BRANCH__]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # TODO(git-setup-repo): verify current action majors or pin immutable SHAs.
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # TODO(git-setup-repo): remove this step when the pinned Node release's bundled npm is the chosen baseline.
      - name: Set up npm
        run: |
          npm install --global npm@__NPM_VERSION__
          test "$(npm --version)" = "__NPM_VERSION__"

      - name: Install dependencies
        run: npm ci --prefer-offline --include=optional

      - name: Check formatting
        run: npm run format:check

      - name: Lint and type-check
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
